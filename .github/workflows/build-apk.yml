name: Unpack, Build & Release Signed APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'DroiDS-v*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unpack DroiDS release zip if present
        run: |
          ZIP_FILE=$(ls DroiDS-v*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -x ".github/*"
            rm -f DroiDS-v*.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || (git commit -m "Unpack $ZIP_FILE" && git push)
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore from Secrets
        env:
          DROIDS_KEYSTORE_BASE64: ${{ secrets.DROIDS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DROIDS_KEYSTORE_BASE64" ]; then
            echo "::error::Missing DROIDS_KEYSTORE_BASE64 repository secret! Add your base64-encoded release keystore in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$DROIDS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/droids-release.jks"
          echo "DROIDS_KEYSTORE_PATH=$RUNNER_TEMP/droids-release.jks" >> "$GITHUB_ENV"

      - name: Build & Rename Signed Release APK
        env:
          DROIDS_KEYSTORE_PASSWORD: ${{ secrets.DROIDS_KEYSTORE_PASSWORD }}
          DROIDS_KEY_ALIAS: ${{ secrets.DROIDS_KEY_ALIAS }}
          DROIDS_KEY_PASSWORD: ${{ secrets.DROIDS_KEY_PASSWORD }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)"/\1/')
          VERSION_NAME=${VERSION_NAME:-"2.9.0-pre"}
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          mkdir -p release_apks
          cp app/build/outputs/apk/release/app-release.apk "release_apks/DroiDS-v${VERSION_NAME}.apk"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/droids-release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DroiDS-v${{ env.APP_VERSION }}-apk
          path: release_apks/*.apk
          if-no-files-found: error

      - name: Publish Signed Release APK to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: DroiDS v${{ env.APP_VERSION }} (Build #${{ github.run_number }})
          prerelease: ${{ contains(env.APP_VERSION, '-pre') || contains(env.APP_VERSION, '-beta') || contains(env.APP_VERSION, '-alpha') }}
          files: release_apks/*.apk
          generate_release_notes: true
